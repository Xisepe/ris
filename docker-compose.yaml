version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - crackhash_network
    env_file:
      - .env
    command: [ "mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile" ]
    volumes:
      - mongodb_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongodb:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb_secondary1:
    image: mongo:latest
    container_name: mongodb_secondary1
    restart: always
    networks:
      - crackhash_network
    command: [ "mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile" ]
    volumes:
      - mongodb_secondary1_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile

  mongodb_secondary2:
    image: mongo:latest
    container_name: mongodb_secondary2
    restart: always
    networks:
      - crackhash_network
    command: [ "mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile" ]
    volumes:
      - mongodb_secondary2_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile

  mongo_setup:
    image: mongo:latest
    depends_on:
      - mongodb
      - mongodb_secondary1
      - mongodb_secondary2
    networks:
      - crackhash_network
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        sleep 10 && \
        mongo --host mongodb:27017 --eval "rs.initiate({_id:'rs0',members:[
          {_id:0,host:'mongodb:27017'},
          {_id:1,host:'mongodb_secondary1:27017'},
          {_id:2,host:'mongodb_secondary2:27017'}
        ]})"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - crackhash_network
    env_file:
      - .env
    healthcheck:
      test: rabbitmqctl status
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

networks:
  crackhash_network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_secondary1_data:
  mongodb_secondary2_data:
  rabbitmq_data:
  rabbitmq_logs:
